probe:
  name: Проверить панель
  description: >-
    Опрашивает известные эндпоинты ISAPI вызывной панели и пишет отчёт
    (статус, тип содержимого, первые 120 символов ответа) в журнал Home
    Assistant и в атрибуты кнопки «Проверить панель». Пароль в отчёт не
    попадает.
  fields:
    entry_id:
      name: Домофон
      description: >-
        ID записи конфигурации. Если не указан — проверяются все домофоны.
      required: false
      example: 01J2ZK5X8N7Q3W4R5T6Y7U8I9O
      selector:
        text:
    test_door:
      name: Проверить реле двери
      description: >-
        ВНИМАНИЕ: реально отправит команду открытия двери. По умолчанию
        выключено — проверка не должна открывать вход.
      required: false
      default: false
      selector:
        boolean:
    minutes:
      name: Журнал событий, минут
      description: >-
        За сколько последних минут показать журнал событий терминала
        (AcsEvent). По умолчанию 15.
      required: false
      default: 15
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: мин
